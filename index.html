<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEF3F3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#071416" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sopa Solidária"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body><title>Sopa Solidária</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* App de celular de uma coluna: cabeçalho fixo no topo, conteúdo rolando, abas fixas embaixo (deslizar troca de aba), botão + amarelo */
:root{
  --bg:#EEF3F3; --surface:#FFFFFF; --surface2:#F3F7F7; --ink:#0D2A31; --muted:#56707A; --line:#D9E4E6;
  --pet:#0E4A57; --pet2:#16606F; --petsoft:#DCECEF; --acc:#0E4A57; --on-pet:#FFFFFF; --on-pet-m:#C9E2E7;
  --yel:#F5B800; --on-yel:#0D2A31; --yelsoft:#FFF1C2;
  --warn:#B54708; --warnsoft:#FDE7D7; --good:#1E7A4C; --goodsoft:#DCF2E5; --lil:#7556B0;
  --sunk:#DCE7E9; --sunk-dark:rgba(14,74,87,.18); --sunk-light:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(13,42,49,.06),0 6px 18px rgba(13,42,49,.06);
  --n0:#FFFFFF; --n1:#FFF4B8; --n2:#D4E8F2; --n3:#DDF2D1; --n4:#E6DCF2; --n5:#F8DDE3; --n6:#FBD5B5;
  --scrim:rgba(6,20,24,.45);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071416; --surface:#102326; --surface2:#162E32; --ink:#E4F0F1; --muted:#9DB5BA; --line:#22393D;
  --pet:#155C6B; --pet2:#1D6F80; --petsoft:#173A41; --acc:#86D0DE; --on-pet:#FFFFFF; --on-pet-m:#D3EBF0;
  --yel:#F5B800; --on-yel:#0D2A31; --yelsoft:#3A3214;
  --warn:#F49A5E; --warnsoft:#3A2416; --good:#7FD3A3; --goodsoft:#123222; --lil:#BCA8EA;
  --sunk:#0A1B1E; --sunk-dark:rgba(0,0,0,.55); --sunk-light:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --n0:#102326; --n1:#4A3F0C; --n2:#1D3B4D; --n3:#203F27; --n4:#352A4C; --n5:#4A2430; --n6:#4D2E14;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071416; --surface:#102326; --surface2:#162E32; --ink:#E4F0F1; --muted:#9DB5BA; --line:#22393D;
  --pet:#155C6B; --pet2:#1D6F80; --petsoft:#173A41; --acc:#86D0DE; --on-pet:#FFFFFF; --on-pet-m:#D3EBF0;
  --yel:#F5B800; --on-yel:#0D2A31; --yelsoft:#3A3214;
  --warn:#F49A5E; --warnsoft:#3A2416; --good:#7FD3A3; --goodsoft:#123222; --lil:#BCA8EA;
  --sunk:#0A1B1E; --sunk-dark:rgba(0,0,0,.55); --sunk-light:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --n0:#102326; --n1:#4A3F0C; --n2:#1D3B4D; --n3:#203F27; --n4:#352A4C; --n5:#4A2430; --n6:#4D2E14;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 8px;display:flex;align-items:center;gap:10px}
.top .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.h-sub{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-title{font-family:var(--f-display);font-size:29px;font-weight:800;color:var(--ink);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.dotsnav{display:flex;justify-content:center;gap:6px;padding-block:0 8px}
.dotsnav i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:width .2s}
.dotsnav i.on{width:18px;background:var(--ink)}
#main{display:flex;flex-direction:column;gap:12px;padding-block:4px calc(170px + env(safe-area-inset-bottom,0px))}
#main > *{flex-shrink:0}
#main.in-r{animation:inR .2s ease-out} #main.in-l{animation:inL .2s ease-out}
@keyframes inR{from{transform:translateX(22px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-22px);opacity:0}to{transform:none;opacity:1}}

/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.hero{background:var(--pet);color:var(--on-pet);border-color:transparent}
.hero .m{color:var(--on-pet-m)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.wrapr{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.b{font-weight:700}
.t16{font-size:17px;font-weight:800}
.big{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 4px 0}
.sec button{font-size:13px;letter-spacing:0;text-transform:none}
.btn{min-height:46px;border-radius:14px;border:0;padding:0 16px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--pet);color:var(--on-pet)}
.btn.yel{background:var(--yel);color:var(--on-yel)}
.btn.out{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost{background:var(--petsoft);color:var(--acc)}
.btn.danger{background:var(--warnsoft);color:var(--warn)}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.5}
.icb{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:64px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;text-align:left;color:var(--ink);box-shadow:var(--shadow)}
.tile svg{color:var(--acc);flex-shrink:0}
.tile.y{background:var(--yel);color:var(--on-yel);border-color:transparent} .tile.y svg{color:var(--on-yel)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink)}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .tx > span{overflow-wrap:anywhere}
.chip{font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--goodsoft);color:var(--good)}
.c-warn{background:var(--warnsoft);color:var(--warn)}
.c-pet{background:var(--petsoft);color:var(--acc)}
.c-yel{background:var(--yel);color:var(--on-yel)}
.bar{height:9px;border-radius:9px;background:var(--surface2);overflow:hidden}
.hero .bar{background:var(--pet2)}
.bar > i{display:block;height:100%;background:var(--pet);border-radius:9px}
.hero .bar > i{background:var(--yel)}
.bar.over > i{background:var(--warn)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;font-size:14px;font-weight:700;padding:0 14px;height:38px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.thumb{width:44px;height:44px;border-radius:13px;background:var(--petsoft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.av{width:30px;height:30px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--petsoft);color:var(--acc);border:2px solid var(--surface);margin-left:-8px}
.av:first-child{margin-left:0}
.chart{height:120px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line)}
.chart .bk{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.chart .bk i{display:block;width:min(14px,40%);border-radius:5px 5px 0 0}
.chart .e{background:var(--pet)} .chart .s{background:var(--yel)}
.lbls{display:flex;gap:4px} .lbls span{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)} .lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);padding:2px 0}
.cal button{height:48px;border:0;border-radius:13px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.cal button.today{box-shadow:inset 0 0 0 2px var(--yel)}
.cal button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:3px;display:block}
.d-sopa{background:var(--yel)} .d-compra{background:var(--acc)} .d-reuniao{background:var(--lil)} .d-outro{background:var(--muted)}
.mini{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--ink)}

/* notas estilo Keep */
.notes{columns:2;column-gap:10px}
.note{break-inside:avoid;margin:0 0 10px;border-radius:16px;padding:0;display:flex;flex-direction:column;width:100%;border:1px solid var(--line);text-align:left;font-size:13.5px;overflow:hidden;background:var(--nc);color:var(--ink)}
.note[data-c]:not([data-c="0"]){border-color:transparent}
.note .nb{padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.note img{width:100%;display:block;max-height:220px;object-fit:cover}
.note .nt{font-size:15px;font-weight:800;overflow-wrap:anywhere}
.note .nx{white-space:pre-line;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow-wrap:anywhere;opacity:.88}
.note .ck{display:flex;gap:8px;align-items:flex-start;overflow-wrap:anywhere}
.note .ck i{width:14px;height:14px;margin-top:2px;border-radius:4px;border:1.5px solid currentColor;flex-shrink:0;opacity:.7}
.note .ck.ok{text-decoration:line-through;opacity:.6} .note .ck.ok i{background:currentColor}
.note .pinm{font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:4px;opacity:.7}

/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:8px max(4px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;font-size:11px;letter-spacing:-.01em;font-weight:600;color:var(--muted);min-height:56px}
nav.tabs button span{width:46px;height:34px;border-radius:999px;display:grid;place-items:center;transition:background .18s}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:800}
nav.tabs button[aria-current="page"] span{background:var(--sunk);box-shadow:inset 0 2px 5px var(--sunk-dark),inset 0 -1px 2px var(--sunk-light)}
.fab{position:fixed;z-index:26;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(92px + env(safe-area-inset-bottom,0px));height:58px;min-width:58px;padding:0 20px 0 16px;border-radius:20px;border:0;background:var(--yel);color:var(--on-yel);box-shadow:0 8px 22px rgba(13,42,49,.28);display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
@media (min-width:600px){.fab{right:calc(50% - 280px + 16px)}}
.sync{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);position:relative;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.sync i{position:absolute;right:9px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
.sync.on i{background:var(--good)} .sync.wait i{background:var(--yel)}

/* folhas */
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:var(--scrim)}
.sh{background:var(--surface);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;overflow-x:hidden;padding-block:8px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sh > *{flex-shrink:0}
.sh .grab{width:46px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 0;position:relative}
.sh .grab::before{content:"";position:absolute;inset:-16px -90px}
#sheet{transition:background-color .2s}
.sh h2{font-family:var(--f-display);font-size:23px;font-weight:800;margin:0;color:var(--ink);text-wrap:balance}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:700;min-width:0}
.f input:not([type=checkbox]):not([type=file]),.f select,.f textarea{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);padding:0 13px;font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.f textarea{padding:11px 13px;min-height:100px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink);outline:none}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);min-height:44px;font-weight:600}
.ck input{width:22px;height:22px;accent-color:var(--pet)}
.photo{display:flex;align-items:center;gap:12px}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:14px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0}
.swatch{width:40px;height:40px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);flex:none}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--petsoft);color:var(--acc);border-radius:999px;padding:0 6px 0 12px;min-height:36px;font-size:13.5px;font-weight:700;border:0}
.empty{text-align:center;padding:22px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;gap:10px;align-items:center;font-size:14px}
.empty .t16{color:var(--ink)}
.bottombar{background:var(--pet);color:var(--on-pet);border-radius:20px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:8px;position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));box-shadow:0 8px 22px rgba(13,42,49,.25)}
.bottombar .m{color:var(--on-pet-m)}
.warnbox{background:var(--warnsoft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700}
.infobox{background:var(--petsoft);color:var(--acc);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:80;max-width:calc(100% - 32px);text-align:center}
.credit{text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding-top:14px}

/* tela cheia: nota e receita */
.tela{position:fixed;inset:0;z-index:55;background:var(--nc,var(--bg));color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:kin .18s ease-out}
@keyframes kin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ktop,.kbar{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:720px;width:100%;margin:0 auto}
.kbar{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent);flex-wrap:wrap}
.kbtn{width:46px;height:46px;border-radius:15px;border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);display:grid;place-items:center;flex:none;position:relative}
.kbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.kbtn.warn{background:var(--warnsoft);color:var(--warn)}
.kscroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:20px;max-width:720px;width:100%;margin:0 auto}
.kscroll > *{flex-shrink:0}
.ktitle{border:0;background:transparent;font-family:var(--f-display);font-size:27px;line-height:1.2;font-weight:800;padding:8px 0;width:100%;min-width:0;color:var(--ink)}
.kbody{border:0;background:transparent;resize:none;font-family:var(--f-body);font-size:17px;line-height:1.5;padding:4px 0 10px;width:100%;min-height:120px;color:var(--ink);overflow:hidden}
.ktitle:focus,.kbody:focus,.kline input:focus{outline:none}
.ktitle::placeholder,.kbody::placeholder,.kline input::placeholder{color:color-mix(in srgb,var(--ink) 45%,transparent)}
.kline{display:flex;align-items:center;gap:6px;min-height:44px}
.kline input[type=checkbox]{width:22px;height:22px;accent-color:var(--pet);flex:none}
.kline input:not([type=checkbox]){flex:1;min-width:0;border:0;background:transparent;font-size:16.5px;color:var(--ink);padding:8px 0}
.kline.ok input:not([type=checkbox]){text-decoration:line-through;opacity:.6}
.kline button{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.kadd{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:15px;padding:8px 0}
.kimg{position:relative;border-radius:14px;overflow:hidden;margin:6px 0}
.kimg img{width:100%;max-height:340px;object-fit:cover;display:block}
.kimg .rm{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.palette{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px;flex:1;min-width:0}
.kwhen{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:auto}
.ing{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}

.step{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink)}
.step:first-child{border-top:0}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;color:var(--ink)}
.pcard .ph{width:72px;height:72px;border-radius:16px;object-fit:cover;flex-shrink:0;background:var(--petsoft)}

.prow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:14.5px}
.prow .mk{font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.prow .dt{color:var(--muted);font-size:12.5px;font-weight:600}
.prow .pv{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.prow.best .pv{color:var(--good)}
.mkchips{display:flex;flex-wrap:wrap;gap:6px}
.mkchip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;font-size:13.5px;color:var(--ink)}
.mkchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

var toastT;
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2800); }

/* ================== dados (offline primeiro) ================== */
var S = carregar();
function carregar(){
  try { var j = JSON.parse(localStorage.getItem(KEY)); if (j && j.recs) return {recs:j.recs, pend:j.pend || [], meta:j.meta || {}}; } catch (e) {}
  return {recs:{}, pend:[], meta:{}};
}
var avisouCheio = false;
function guardar(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!avisouCheio){ avisouCheio = true; toast('A memória do app neste aparelho está cheia. Apague fotos antigas.'); } }
}
function all(c){ var o = []; for (var k in S.recs){ var r = S.recs[k]; if (r.c === c && !r.d) o.push(r); } return o; }
function get(id){ var r = id && S.recs[id]; return r && !r.d ? r : null; }
function gravar(r, silencioso){
  r.u = Date.now(); S.recs[r.id] = r;
  if (S.pend.indexOf(r.id) < 0) S.pend.push(r.id);
  guardar(); Sync.kick();
  if (!silencioso) render();
  return r;
}
function novo(c, campos){ var r = Object.assign({id:uid(), c:c}, campos); return gravar(r); }
function apagar(id){ var r = S.recs[id]; if (!r) return; var t = {id:r.id, c:r.c, d:true}; gravar(t); }
function mesclar(rem){
  if (!rem || !rem.id) return false;
  var l = S.recs[rem.id];
  if (!l || (rem.u || 0) > (l.u || 0)){ S.recs[rem.id] = rem; S.pend = S.pend.filter(function(x){ return x !== rem.id; }); return true; }
  return false;
}
function cfg(){ return get('cfg') || {id:'cfg', c:'cfg', grupo:'', orc:300, local:''}; }
function foto(id){ var r = get(id); return r ? r.img : ''; }

/* ================== sincronização ================== */
var Sync = {
  modo:'local', db:null, ok:false, ocupado:false, t:null, erro:'',
  init: function(){
    var self = this;
    var temClaude = !!(window.claude && typeof window.claude.use === 'function');
    if (temClaude){
      window.claude.use('db').then(function(db){
        if (db){ self.db = db; self.modo = 'link'; self.ouvir(); self.kick(); }
        render();
      }).catch(function(){ render(); });
    } else {
      var sp0 = S.meta.supa; if (sp0 && sp0.grupo && sp0.grupo !== normGrupo(sp0.grupo)){ sp0.grupo = normGrupo(sp0.grupo); S.meta.puxado = null; S.pend = Object.keys(S.recs); guardar(); }
      self.modo = supaCfg() ? 'supa' : 'local';
      if (self.modo === 'supa'){ self.push(); setInterval(function(){ self.push(); }, 30000); }
    }
    window.addEventListener('online', function(){ self.push(); renderTopo(); });
    window.addEventListener('offline', function(){ renderTopo(); });
  },
  ouvir: function(){
    var self = this;
    try {
      self.db.collection('registros').onSnapshot(function(snap){
        var mudou = false;
        snap.docChanges().forEach(function(ch){
          if (ch.type === 'removed') return;
          var d = ch.doc.data(); if (d && mesclar(clone(d))) mudou = true;
        });
        self.ok = true;
        if (mudou){ guardar(); render(); } else renderTopo();
      }, function(e){ self.ok = false; self.erro = e && e.code; renderTopo(); });
    } catch (e) { self.ok = false; }
  },
  kick: function(){ var self = this; clearTimeout(this.t); this.t = setTimeout(function(){ self.push(); }, 700); renderTopo(); },
  push: function(){
    var self = this;
    if (self.modo === 'local') return Promise.resolve(null);
    if (self.ocupado) return self.atual;
    self.ocupado = true;
    var p = self.modo === 'link' ? self.pushLink() : self.pushSupa();
    self.atual = p.catch(function(){ return null; }).then(function(r){ self.ocupado = false; renderTopo(); if (V.view === 'ajustes' && !SK) render(); return r; });
    return self.atual;
  },
  pushLink: function(){
    var self = this; var ids = S.pend.slice();
    function passo(i){
      if (i >= ids.length){ guardar(); return Promise.resolve(); }
      var r = S.recs[ids[i]];
      if (!r){ S.pend = S.pend.filter(function(x){ return x !== ids[i]; }); return passo(i + 1); }
      return self.db.doc('registros/' + r.id).set(clone(r)).then(function(){
        if ((S.recs[r.id] || {}).u === r.u) S.pend = S.pend.filter(function(x){ return x !== r.id; });
        return passo(i + 1);
      }, function(e){
        if (e && e.code === 'quota_exceeded') toast('O espaço de sincronização encheu. Apague fotos e registros antigos.');
        guardar();
      });
    }
    return passo(0);
  },
  pushSupa: function(){
    var c = supaCfg(); if (!c) return Promise.resolve(null);
    if (!navigator.onLine){ Sync.ok = false; Sync.erro = 'Sem internet neste aparelho.'; return Promise.resolve(null); }
    var h = {'apikey':c.key, 'Content-Type':'application/json'};
    if (/^eyJ/.test(c.key)) h.Authorization = 'Bearer ' + c.key;
    var base = c.url.replace(/\/+$/, '').replace(/\/rest\/v1.*$/, '') + '/rest/v1/registros';
    var ids = S.pend.slice(); var enviados = 0, recebidos = 0;
    function falha(res, etapa){
      return res.text().then(function(t){
        var msg = '';
        try { msg = JSON.parse(t).message || ''; } catch (e) {}
        var st = res.status, txt;
        if (st === 401 || st === 403) txt = 'O servidor recusou a chave. Confira se copiou a chave anon public inteira.';
        else if (st === 404 || /registros/.test(msg) && /exist|find/i.test(msg)) txt = 'A tabela não existe no Supabase. Rode o texto do SQL Editor.';
        else if (st === 413) txt = 'Envio grande demais (muitas fotos de uma vez).';
        else txt = 'Erro ' + st + ' ao ' + etapa + (msg ? ': ' + msg : '.');
        throw new Error(txt);
      });
    }
    function lote(i){
      if (i >= ids.length) return Promise.resolve();
      var parte = ids.slice(i, i + 25);
      var rows = parte.map(function(id){ var r = S.recs[id]; return r ? {grupo:c.grupo, id:r.id, c:r.c || '', u:r.u || 0, d:!!r.d, dados:r} : null; }).filter(Boolean);
      if (!rows.length) return lote(i + 25);
      return fetch(base + '?on_conflict=grupo,id', {method:'POST', headers:Object.assign({'Prefer':'resolution=merge-duplicates,return=minimal'}, h), body:JSON.stringify(rows)}).then(function(res){
        if (!res.ok) return falha(res, 'enviar');
        rows.forEach(function(r){ var atual = S.recs[r.id]; if (!atual || atual.u === r.u) S.pend = S.pend.filter(function(x){ return x !== r.id; }); });
        enviados += rows.length; guardar(); return lote(i + 25);
      });
    }
    function puxar(){
      var desde = S.meta.puxado || '1970-01-01T00:00:00Z';
      return fetch(base + '?select=dados,recebido&grupo=eq.' + encodeURIComponent(c.grupo) + '&recebido=gt.' + encodeURIComponent(desde) + '&order=recebido.asc&limit=500', {headers:h}).then(function(res){
        if (!res.ok) return falha(res, 'receber');
        return res.json();
      }).then(function(lin){
        var mudou = false;
        lin.forEach(function(l){ if (mesclar(l.dados)) mudou = true; S.meta.puxado = l.recebido; });
        recebidos += lin.length; guardar(); if (mudou) render();
        if (lin.length === 500) return puxar();
      });
    }
    return lote(0).then(puxar).then(function(){
      Sync.ok = true; Sync.erro = ''; S.meta.ultimoSync = Date.now(); guardar();
      return {enviados:enviados, recebidos:recebidos};
    }).catch(function(e){
      Sync.ok = false;
      Sync.erro = (e && e.name === 'TypeError') ? 'Não consegui falar com o servidor. Confira a Project URL (https://….supabase.co) e a internet.' : String(e && e.message || e);
      return null;
    });
  }
};
function normGrupo(g){ return String(g || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
function supaCfg(){ var s = S.meta.supa; return s && s.url && s.key && s.grupo ? s : null; }
function syncInfo(){
  var n = S.pend.length;
  if (Sync.modo === 'local') return {cls:'', txt: n ? 'Neste aparelho' : 'Neste aparelho'};
  if (!navigator.onLine) return {cls:'wait', txt:'Offline' + (n ? ' · ' + n + ' a enviar' : '')};
  if (n) return {cls:'wait', txt:'Enviando ' + n};
  return Sync.ok ? {cls:'on', txt:'Sincronizado'} : {cls:'wait', txt:'Conectando'};
}

/* ================== regras do grupo ================== */
function lancs(){ return all('lanc'); }
function somar(L){ var e = 0, s = 0; L.forEach(function(l){ var v = num(l.valor); if (l.tipo === 'ent') e += v; else s += v; }); return {e:e, s:s, saldo:e - s}; }
function lancsEntre(a, b){ var A = ymd(a), B = ymd(b); return lancs().filter(function(l){ return l.data >= A && l.data < B; }); }
function totalCompra(c){ return (c.itens || []).reduce(function(t, i){ return t + (i.doado ? 0 : num(i.qtd) * num(i.preco)); }, 0); }
function compras(){ return all('compra').sort(function(a, b){ return (b.data || '').localeCompare(a.data || '') || (b.u - a.u); }); }
function eventos(){ return all('evento').sort(function(a, b){ return (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || '')); }); }
function sopas(){ return eventos().filter(function(e){ return e.tipo === 'sopa'; }); }
function sopaAtual(){
  var a = get(V.sopa); if (a && a.tipo === 'sopa') return a;
  var m = get(S.meta.sopaSel); if (m && m.tipo === 'sopa' && (m.data >= hoje() || !(m.reg && m.reg.encerrado))) return m;
  var ss = sopas(); return proximaSopa() || ss.filter(function(x){ return x.data >= hoje(); })[0] || ss[ss.length - 1] || null;
}
function escolherSopa(id){ V.sopa = id; S.meta.sopaSel = id; guardar(); }
function proximaSopa(){ var h = hoje(); return sopas().filter(function(e){ return e.data >= h && !(e.reg && e.reg.encerrado); })[0] || null; }
function fotoEmUso(fid, menosItem){ return compras().some(function(c){ return (c.itens || []).some(function(i){ return i.id !== menosItem && i.fotoProd === fid; }); }); }
function chaveProd(n){ return low(n).replace(/\s+/g, ' '); }
function mercados(){
  var m = {}; compras().forEach(function(c){ var n = String(c.mercado || '').trim(); if (!n) return; var k = low(n); if (!m[k]) m[k] = {nome:n, vezes:0, ult:''}; m[k].vezes++; if ((c.data || '') > m[k].ult) m[k].ult = c.data || ''; });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a, b){ return b.ult.localeCompare(a.ult) || b.vezes - a.vezes; });
}
function produtos(){

/* ================== arrastar o menu para baixo fecha ================== */
(function(){
  var sh = null, y0 = 0, dy = 0, t0 = 0, armado = false;
  function fecharGesto(){ if (SK === 'nota') A.fecharNota(); else fechar(true); }
  document.addEventListener('touchstart', function(e){
    armado = false; sh = e.target.closest('#sheet .sh'); if (!sh || e.touches.length !== 1) return;
    var naAlca = !!e.target.closest('.grab');
    if (!naAlca && (sh.scrollTop > 0 || e.target.closest('textarea'))) return;

  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if (!armado) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0){ sh.style.transform = ''; return; }
    if (e.cancelable) e.preventDefault();
    sh.style.transform = 'translateY(' + dy + 'px)';
    $('#sheet').style.backgroundColor = 'rgba(6,20,24,' + Math.max(0, .45 - dy / 900).toFixed(3) + ')';
  }, {passive:false});
  function soltar(){
    if (!armado) return; armado = false;
    var vel = dy / Math.max(1, Date.now() - t0);
    sh.style.transition = 'transform .2s ease-out';
    if (dy > 110 || (dy > 40 && vel > .6)){

      setTimeout(function(){ if (alvo.isConnected) fecharGesto(); $('#sheet').style.backgroundColor = ''; }, 190);
    } else { sh.style.transform = ''; $('#sheet').style.backgroundColor = ''; }
  }
  document.addEventListener('touchend', soltar); document.addEventListener('touchcancel', soltar);
})();
